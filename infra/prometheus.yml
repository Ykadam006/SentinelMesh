global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'metrics-api'
    static_configs:
      - targets: ['metrics-api:8081']

  - job_name: 'alert-engine'
    static_configs:
      - targets: ['alert-engine:8082']

  - job_name: 'incident-api'
    static_configs:
      - targets: ['incident-api:8083']

  - job_name: 'stream-processor'
    static_configs:
      - targets: ['stream-processor:8084']
