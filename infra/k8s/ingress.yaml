apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sentinelmesh-ingress
  namespace: sentinelmesh
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: sentinelmesh.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 80
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dashboard
            port:
              number: 80
