version: '3.8'

services:
  # -----------------------------
  # Postgres (Primary Database)
  # -----------------------------
  postgres:
    image: postgres:15
    container_name: sentinelmesh-postgres
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sentinelmesh
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelmesh"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Kafka & Zookeeper
  # -----------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: sentinelmesh-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: sentinelmesh-kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------
  # Elasticsearch & Kibana
  # -----------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: sentinelmesh-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\\|yellow\"'"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: sentinelmesh-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"

  # -----------------------------
  # Prometheus & Grafana
  # -----------------------------
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: sentinelmesh-prometheus
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.1.5
    container_name: sentinelmesh-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

  # -----------------------------
  # SentinelMesh Microservices
  # -----------------------------
  metrics-api:
    build:
      context: .
      dockerfile: services/metrics-api/Dockerfile
    container_name: sentinelmesh-metrics-api
    ports:
      - "50051:50051"
      - "8081:8081"
    environment:
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  incident-api:
    build:
      context: .
      dockerfile: services/incident-api/Dockerfile
    container_name: sentinelmesh-incident-api
    ports:
      - "50052:50052"
      - "8083:8083"
    environment:
      - DB_HOST=postgres
      - DB_USER=sentinel
      - DB_PASSWORD=password
      - DB_NAME=sentinelmesh
      - DB_PORT=5432
      - KAFKA_BROKER=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  alert-engine:
    build:
      context: .
      dockerfile: services/alert-engine/Dockerfile
    container_name: sentinelmesh-alert-engine
    ports:
      - "8082:8082"
    environment:
      - KAFKA_BROKER=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  stream-processor:
    build:
      context: .
      dockerfile: services/stream-processor/Dockerfile
    container_name: sentinelmesh-stream-processor
    ports:
      - "8084:8084"
    environment:
      - KAFKA_BROKER=kafka:9092
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: sentinelmesh-api-gateway
    ports:
      - "8080:8080"
    environment:
      - METRICS_API_HOST=metrics-api:50051
      - INCIDENT_API_HOST=incident-api:50052
      - ALERT_ENGINE_URL=http://alert-engine:8082
    depends_on:
      - metrics-api
      - incident-api

  # -----------------------------
  # React Dashboard
  # -----------------------------
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: sentinelmesh-dashboard
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  es_data:
  grafana_data:
